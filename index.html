<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NITW Campus Guide — Induction 2026</title>
<link rel="icon" type="image/webp" href="nitw_logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cloud.umami.is/script.js" data-website-id="30777bbb-ba11-46c4-b46d-b83cf45efb2f"></script>
<style>
  :root{
    --bg: #f4f7f2;
    --surface: #ffffff;
    --surface-hover: #f7faf5;
    --stone: #4285F4;
    --stone-dim: #1a73e8;
    --moss: #0f9d58;
    --red: #ea4335;
    --yellow: #fbbc05;
    --green: #34a853;
    --text: #202124;
    --text-dim: #5f6368;
    --line: #e7ece4;
  }
  *{ box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html{ -webkit-text-size-adjust: 100%; }
  html,body{ background: var(--bg); color: var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  body{ min-height:100vh; padding-bottom: 48px; touch-action: manipulation; }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 12% 16%, rgba(52,168,83,0.13) 0, rgba(52,168,83,0.13) 18%, transparent 19%),
      radial-gradient(circle at 82% 18%, rgba(251,188,5,0.14) 0, rgba(251,188,5,0.14) 16%, transparent 17%),
      radial-gradient(circle at 58% 78%, rgba(234,67,53,0.09) 0, rgba(234,67,53,0.09) 12%, transparent 13%);
    pointer-events:none;
  }

  header{
    position: sticky; top:0; z-index: 10;
    background: linear-gradient(180deg, rgba(244,247,242,0.96) 70%, rgba(244,247,242,0.9) 100%);
    backdrop-filter: blur(6px);
    padding: clamp(12px, 4vw, 20px) clamp(12px, 4vw, 20px) clamp(8px, 3vw, 12px);
    border-bottom: 1px solid var(--line);
  }
  
  .title-row {
    display: flex;
    align-items: center;
    gap: clamp(8px, 3vw, 16px);
    margin-bottom: clamp(4px, 2vw, 8px);
    min-width: 0; /* Allows flex items to shrink below content size */
  }
  
  .club-logo {
    height: clamp(32px, 8vw, 44px);
    width: auto;
    border-radius: 6px;
    flex-shrink: 0;
  }
  
  /* Eyebrow below the title */
  header .eyebrow {
    margin-top: clamp(6px, 2vw, 8px);
    margin-bottom: 0;
    font-size: clamp(11px, 2.5vw, 12px);
  }
  
  .eyebrow{
    display:flex; align-items:center; gap:0;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--stone); font-weight:600;
  }
  h1{
    font-family:'Zilla Slab', serif; font-weight:700;
    font-size: clamp(18px, 5vw, 34px);
    line-height:1.1; color: var(--text); margin-bottom: 0;
    min-width: 0; /* Allows text to shrink and wrap if needed */
  }
  header p.sub{ 
    color: var(--text-dim); 
    font-size: clamp(12px, 3vw, 13px);
    margin-top: clamp(8px, 2vw, 10px);
    line-height: 1.4;
    font-weight: 500;
  }

  .search-wrap{ padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 20px) 0; }
  .search{
    width:100%; padding: clamp(11px, 2vw, 14px) clamp(12px, 3vw, 14px); border-radius: 12px;
    background: var(--surface); border: 1.5px solid var(--line);
    color: var(--text); font-family:'Inter',sans-serif; font-size:clamp(14px, 3.5vw, 16px);
    min-height: clamp(42px, 10vw, 48px);
    transition: all 0.3s ease;
    box-shadow: 0 8px 18px rgba(66,133,244,0.04);
  }
  .search::placeholder{ color: var(--text-dim); }
  .search:focus{ 
    outline:none; 
    border-color: var(--stone); 
    box-shadow: 0 0 12px rgba(201,138,62,0.25);
    background: var(--surface-hover);
  }

  .tabs{
    display:flex; gap:clamp(6px, 2vw, 8px); padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(4px, 2vw, 6px);
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0; padding: clamp(8px, 2vw, 10px) clamp(14px, 3vw, 18px); border-radius: 8px;
    border: none; background: transparent;
    color: var(--text-dim); font-size: clamp(12px, 2.5vw, 13.5px); font-weight:600;
    letter-spacing:0.02em; cursor:pointer; transition: all 0.2s ease;
    font-family:'Inter',sans-serif; min-height: clamp(36px, 8vw, 40px);
    border-bottom: 2px solid transparent;
    position: relative;
  }
  .tab.active{ 
    color: var(--green);
    border-bottom-color: var(--green);
    background: rgba(52,168,83,0.08);
  }
  .tab:hover{ color: var(--text); }
  .tab:active{ transform: scale(0.97); }

  main{ padding: 6px 16px 0; max-width: 640px; margin: 0 auto; }
  .group-label{
    font-family:'Zilla Slab', serif; font-weight:700; font-size: clamp(11px, 2.5vw, 13px);
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--moss);
    margin: 24px 2px 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(92, 131, 116, 0.3);
  }
  .card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--surface); border:1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 14px; transition: all 0.3s ease;
    text-decoration:none; color: inherit; min-height: 64px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(15, 157, 88, 0.03);
  }
  .card:hover{ 
    background: var(--surface-hover); 
    border-color: rgba(66,133,244,0.7);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(66,133,244,0.08);
  }
  .card:active{ 
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(52,168,83,0.08);
  }
  .card-name{ 
    font-size:clamp(14px, 3.5vw, 15.5px); 
    font-weight:700; 
    color: var(--text); 
    margin-bottom:6px; 
    line-height:1.3;
    transition: color 0.2s ease;
  }
  .card:hover .card-name{ color: var(--stone); }
  .card-desc{ 
    font-size:clamp(12px, 3vw, 13px); 
    color: var(--text-dim); 
    line-height:1.4;
    transition: color 0.2s ease;
  }
  .card:hover .card-desc{ color: var(--text); }
  .go-chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    background: rgba(52,168,83,0.1); border:1.5px solid var(--green); color: var(--green);
    padding: clamp(7px, 2vw, 9px) clamp(11px, 3vw, 13px); border-radius: 8px; 
    font-size: clamp(11px, 2.5vw, 12px); font-weight:700;
    white-space:nowrap; pointer-events: none;
    transition: all 0.2s ease;
  }
  .card:hover .go-chip{
    background: rgba(52,168,83,0.16);
    transform: translateX(2px);
  }
  .go-chip svg{ width:clamp(12px, 3vw, 14px); height:clamp(12px, 3vw, 14px); flex-shrink:0; }

  .hint{ font-size:12.5px; color: var(--text-dim); padding: 2px 2px 4px; }

  .empty{ text-align:center; color: var(--text-dim); padding: 40px 20px; font-size:14px; }

  footer{
    text-align:center; color: var(--text-dim); font-size:12px;
    margin-top: 40px; padding: 0 20px;
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <img src="club_logo.webp" alt="Club Logo" class="club-logo">
    <div>
      <h1>Find Your Way Around NITW</h1>
      <div class="eyebrow">Junior Induction · 17 Aug</div>
    </div>
  </div>
  <p class="sub">Search or filter the campus and open any place in Google Maps.</p>
</header>

<div class="search-wrap">
  <input class="search" id="searchInput" type="text" placeholder="Search a department, hostel, or landmark…" />
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-cat="all">All</button>
  <button class="tab" data-cat="dept">Departments</button>
  <button class="tab" data-cat="hostel">Hostels</button>
  <button class="tab" data-cat="landmark">Landmarks</button>
</div>

<main>
  <div class="hint">Tap any card to open it in Google Maps</div>
  <div id="results"></div>
</main>

<footer>NIT Warangal Campus Guide · Built for Induction 2026</footer>

<script src="locations.js"></script>
<script>
const LOCATIONS = window.LOCATIONS || [];

const results = document.getElementById('results');
const searchInput = document.getElementById('searchInput');
const tabs = document.querySelectorAll('.tab');
let activeCat = 'all';

function mapsUrl(coords){
  const cleanCoords = String(coords).replace(/\s+/g, '');
  return "https://www.google.com/maps/search/?api=1&query=" + cleanCoords;
}

function render(){
  const term = searchInput.value.trim().toLowerCase();
  const filtered = LOCATIONS.filter(loc => {
    const matchesCat = activeCat === 'all' || loc.category === activeCat;
    const matchesSearch = !term || loc.name.toLowerCase().includes(term) || loc.desc.toLowerCase().includes(term);
    return matchesCat && matchesSearch;
  });

  if(filtered.length === 0){
    results.innerHTML = '<div class="empty">No matches. Try a different search.</div>';
    return;
  }

  const groups = { dept: "Departments", hostel: "Hostels", landmark: "Landmarks" };
  let html = "";
  Object.keys(groups).forEach(cat => {
    const items = filtered.filter(l => l.category === cat);
    if(items.length === 0) return;
    html += `<div class="group-label">${groups[cat]}</div>`;
    items.forEach(loc => {
      html += `
        <a class="card" href="${mapsUrl(loc.coords)}" rel="noopener noreferrer" target="_blank">
          <div>
            <div class="card-name">${loc.name}</div>
            <div class="card-desc">${loc.desc}</div>
          </div>
          <span class="go-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            Open
          </span>
        </a>`;
    });
  });
  results.innerHTML = html;
}

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCat = tab.dataset.cat;
    render();
  });
});
searchInput.addEventListener('input', render);
render();
</script>
</body>
</html>
